<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Rules — Summary</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    padding: 28px 32px;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.6rem;
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { color: #94a3b8; font-size: 0.9rem; margin: 4px 0 18px; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 20px;
  }

  .profile-selector {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(251, 191, 36, 0.05);
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(251, 191, 36, 0.15);
  }

  .profile-selector label {
    font-size: 0.7rem;
    color: #94a3b8;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .profile-selector select {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fbbf24;
    padding: 3px 6px;
    border-radius: 5px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }

  .main-card {
    background: rgba(96,165,250,0.1);
    border: 2px solid #60a5fa;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .main-card .name { font-size: 1.15rem; font-weight: 700; color: #60a5fa; }
  .main-card .desc { color: #cbd5e1; font-size: 0.85rem; margin: 4px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 0.72rem; padding: 3px 9px; border-radius: 5px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .chip.disp { background: rgba(96,165,250,0.2); border: 1px solid rgba(96,165,250,0.5); color: #93c5fd; }
  .chip.mcp  { background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.45); color: #c4b5fd; }
  .row-label { font-size: 0.72rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin: 10px 0 5px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .card {
    background: rgba(30,41,59,0.8);
    border: 1px solid rgba(148,163,184,0.25);
    border-left: 3px solid #60a5fa;
    border-radius: 8px;
    padding: 13px 15px;
    display: flex;
    flex-direction: column;
  }
  .card.custom {
    border-left-color: #fbbf24;
  }
  .card .name { font-weight: 700; font-size: 0.95rem; color: #e2e8f0; }
  .card .model {
    display: inline-block; font-size: 0.68rem; font-family: ui-monospace, Menlo, monospace;
    color: #c4b5fd; background: rgba(167,139,250,0.15);
    border: 1px solid rgba(167,139,250,0.35); border-radius: 4px;
    padding: 1px 6px; margin-top: 4px;
    align-self: flex-start;
  }
  .card .trig { color: #94a3b8; font-size: 0.78rem; line-height: 1.35; margin: 8px 0 9px; flex-grow: 1; }
  .card .mcps { display: flex; flex-wrap: wrap; gap: 5px; }
  .card .mcps .chip { font-size: 0.68rem; padding: 2px 7px; }

  .legend { display: flex; gap: 20px; margin-top: 18px; font-size: 0.78rem; color: #94a3b8; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; }
  .footer { margin-top: 14px; font-size: 0.72rem; color: #475569; }
</style>
</head>
<body>
  <div class="header-row">
    <div>
      <h1>AI Rules Architecture — OMO Slim</h1>
      <div id="agent-count-sub" class="sub">Loading agents...</div>
    </div>
    <div id="profile-container"></div>
  </div>

  <div id="main-content">
    <div style="padding: 40px; text-align: center; color: #94a3b8;">Summoning the Pantheon Summary...</div>
  </div>

  <div class="legend">
    <span><div class="dot" style="background:#60a5fa;"></div>Pantheon Agent</span>
    <span><div class="dot" style="background:#fbbf24;"></div>Custom Agent</span>
    <span><div class="dot" style="background:#a78bfa;"></div>MCP Access</span>
  </div>
  <div class="footer">Full interactive view: agents-overview/index.html · driven by data.yaml</div>

  <script>
    let AVATARS = {};
    let MODEL_NAMES = {};
    let PROFILES = {};
    let currentProfile = 'default';
    let rawData = null;

    fetch('./data.yaml')
      .then(r => r.text())
      .then(t => jsyaml.load(t))
      .then(data => {
        rawData = data;
        AVATARS = data.avatars || {};
        MODEL_NAMES = data.model_names || {};
        PROFILES = data.profiles || {};
        render();
      })
      .catch(e => {
        document.getElementById('main-content').innerHTML = `<div style="color:#f87171">Error: ${e.message}</div>`;
      });

    function prettifyModel(modelId) {
      if (MODEL_NAMES[modelId]) return MODEL_NAMES[modelId];
      if (!modelId) return 'Unknown';
      const parts = modelId.split('/');
      return parts[parts.length - 1].replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }

    function render() {
      const data = rawData;
      const nodes = data.nodes;
      const agents = nodes.filter(n => n.type === 'agent');
      const pantheon = agents.filter(a => a.parent === 'orchestrator' || a.id === 'orchestrator');
      const custom = agents.filter(a => !pantheon.includes(a));
      const orchestrator = agents.find(a => a.id === 'orchestrator');
      const builtins = pantheon.filter(a => a.id !== 'orchestrator');

      // Update sub-header
      document.getElementById('agent-count-sub').textContent = 
        `${orchestrator ? 'Orchestrator + ' : ''}${agents.length - (orchestrator ? 1 : 0)} specialized subagents · ${agents.length} agents total`;

      // Render profile selector
      const profileContainer = document.getElementById('profile-container');
      profileContainer.innerHTML = `
        <div class="profile-selector">
          <label for="profile-select">Model Map</label>
          <select id="profile-select">
            ${Object.keys(PROFILES).map(p => `
              <option value="${p}" ${p === currentProfile ? 'selected' : ''}>
                ${p.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
              </option>
            `).join('')}
          </select>
        </div>
      `;
      document.getElementById('profile-select').addEventListener('change', (e) => {
        currentProfile = e.target.value;
        render();
      });

      // Render Main Content
      let html = '';

      // 1. Orchestrator Card
      if (orchestrator) {
        const orchModel = PROFILES[currentProfile]['orchestrator'] || orchestrator.model;
        html += `
          <div class="main-card">
            <div class="name">${AVATARS.orchestrator || ''} ${orchestrator.label} <span style="font-size:0.7rem;color:#94a3b8;font-weight:400;">— ${orchestrator.role}</span></div>
            <div class="desc">Model: ${prettifyModel(orchModel)}. ${orchestrator.responsibilities.split('\n')[0]}</div>
            <div class="row-label">Dispatches</div>
            <div class="chips">
              ${(orchestrator.dispatches || []).map(d => `<span class="chip disp">${d}</span>`).join('')}
            </div>
            <div class="row-label">MCPs</div>
            <div class="chips">
              ${(orchestrator.mcp_access || '').split(',').map(m => `<span class="chip mcp">${m.trim()}</span>`).join('')}
            </div>
          </div>
        `;
      }

      // 2. Grid for other agents
      html += '<div class="grid">';
      
      // Built-ins
      builtins.forEach(a => {
        const model = PROFILES[currentProfile][a.id] || a.model;
        html += `
          <div class="card">
            <div class="name">${AVATARS[a.id] || ''} ${a.label}</div>
            <span class="model">⚙ ${prettifyModel(model)}</span>
            <div class="trig">${a.trigger || a.role}</div>
            <div class="mcps">
              ${(a.mcp_access || '').split(',').filter(m => m.trim()).map(m => `<span class="chip mcp">${m.trim()}</span>`).join('')}
            </div>
          </div>
        `;
      });

      // Custom
      custom.forEach(a => {
        const model = PROFILES[currentProfile][a.id] || a.model;
        html += `
          <div class="card custom">
            <div class="name">${AVATARS[a.id] || ''} ${a.label}</div>
            <span class="model">⚙ ${prettifyModel(model)}</span>
            <div class="trig">${a.trigger || a.role}</div>
            <div class="mcps">
              ${(a.mcp_access || '').split(',').filter(m => m.trim()).map(m => `<span class="chip mcp">${m.trim()}</span>`).join('')}
            </div>
          </div>
        `;
      });

      html += '</div>';
      document.getElementById('main-content').innerHTML = html;
    }
  </script>
</body>
</html>
