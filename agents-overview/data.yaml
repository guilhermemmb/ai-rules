nodes:
  # Main Orchestrator
  - id: main
    label: main
    type: agent
    role: Orchestrator
    color: '#60a5fa'
    parent: null
    model: claude-sonnet-4-6[1m]
    orchestrates: true
    dispatches:
      - browser-agent
      - observability
      - cortex-agent
      - knowledge-agent
      - plan-agent
      - main (parallel)
    constraints: |
      Cannot directly access: chrome-devtools-mcp, sentry-mcp, gcloud, gcloud-observability-ai-agent, gcloud-observability-chat, cortex, notion, linear
      Must dispatch to appropriate subagent for these tools
    responsibilities: |
      • Plan & design implementation strategy
      • Explore codebase (codebase-memory-mcp, context7-mcp)
      • Implement core changes
      • Run tests & verify
      • Dispatch specialized work to subagents
      • Self-dispatch additional main agents for independent parallel tasks
      • Dispatch Plan agent when architecture design needs to run concurrently with implementation

  # Specialized Agents (children of main)
  - id: browser-agent
    label: browser-agent
    type: agent
    role: Browser Interaction
    color: '#60a5fa'
    parent: main
    model: claude-sonnet-4-6[1m]
    trigger: 'Screenshots, page analysis, UI interaction, E2E testing'
    tools: 'mcp-server-browser, codebase-memory-mcp'
    constraints: |
      Cannot access: Sentry, Datadog, gcloud, gcloud-observability-ai-agent, gcloud-observability-chat, cortex, Notion, Linear
      Browser interaction only — no backend diagnostics
    responsibilities: |
      • Take screenshots & record page state
      • Navigate & interact with pages
      • Analyze DOM & UI elements
      • Test UI flows & interactions
      • Validate page rendering

  - id: observability
    label: observability-and-troubleshoot
    type: agent
    role: Production Diagnostics
    color: '#60a5fa'
    parent: main
    model: claude-sonnet-4-6
    trigger: 'Production errors, logs, metrics, traces, root-cause analysis'
    tools: 'Sentry, pup skills (Datadog), gcloud, gcloud-observability-ai-agent, gcloud-observability-chat, codebase-memory-mcp'
    constraints: |
      Cannot access: chrome-devtools-mcp, cortex, Notion, Linear
      Production diagnostics only — no UI interaction
      Datadog accessed via pup skills (Bash), not MCP
      codebase-memory-mcp is read-only: map telemetry to code, don't infer runtime behavior from it
    responsibilities: |
      • Query Sentry for error details & events
      • Fetch logs via pup skills (Datadog), gcloud & gcloud-observability-{conversations,chat}
      • Analyze metrics & APM traces
      • Trace request paths & dependencies
      • Correlate stack traces to source via codebase-memory-mcp
      • Root cause analysis & incident response

  - id: cortex-agent
    label: cortex-agent
    type: agent
    role: Domain Knowledge
    color: '#60a5fa'
    parent: main
    model: claude-haiku-4-5
    trigger: 'Gorgias metrics, schemas, definitions, business rules, data analysis'
    tools: 'cortex-mcp, BigQuery, codebase-memory-mcp'
    constraints: |
      Cannot access: chrome-devtools-mcp, Sentry/Datadog, Notion, Linear
      Gorgias domain knowledge only — no external docs
      codebase-memory-mcp optional & read-only: cortex stays source of truth for definitions
    responsibilities: |
      • Access Gorgias metric definitions
      • Query BigQuery data & schemas
      • Provide business context & rules
      • Analyze business metrics & KPIs
      • Map metrics/pipelines to code via codebase-memory-mcp
      • Explain domain concepts

  - id: knowledge-agent
    label: knowledge-agent
    type: agent
    role: External Docs & Issues
    color: '#60a5fa'
    parent: main
    model: claude-haiku-4-5
    trigger: 'Design docs, specs, Linear issues, Notion pages, external docs'
    tools: 'notion-mcp, linear-mcp, codebase-memory-mcp'
    constraints: |
      Cannot access: chrome-devtools-mcp, Sentry/Datadog, cortex
      External documentation only — no backend systems
    responsibilities: |
      • Fetch design docs & specs from Notion
      • Read Linear issues & epics
      • Search external documentation
      • Retrieve project context & decisions
      • Link requirements to implementation

  - id: plan-agent
    label: Plan
    type: agent
    role: Architecture Planner
    color: '#60a5fa'
    parent: main
    model: claude-sonnet-4-6[1m]
    trigger: 'Architecture planning — only when running concurrently with implementation tasks'
    tools: 'Read-only (no Edit/Write)'
    constraints: |
      Read-only — cannot edit or write files
      Only worth dispatching during parallel work; use superpowers:writing-plans for sequential planning
    responsibilities: |
      • Design implementation approach for a task
      • Identify critical files and call paths
      • Consider architectural trade-offs
      • Return step-by-step plan for main to execute

  # MCPs (owned by agents)
  - id: codebase-memory
    label: codebase-memory-mcp
    type: mcp
    role: Code Search & Graph
    color: '#a78bfa'
    parent: main

  - id: context7-mcp
    label: context7-mcp
    type: mcp
    role: Library Docs
    color: '#a78bfa'
    parent: main

  - id: mcp-server-browser
    label: mcp-server-browser
    type: mcp
    role: Browser Automation
    color: '#a78bfa'
    parent: browser-agent

  - id: sentry-mcp
    label: sentry-mcp
    type: mcp
    role: Error Monitoring
    color: '#a78bfa'
    parent: observability

  - id: gcloud
    label: gcloud
    type: mcp
    role: GCP Logs
    color: '#a78bfa'
    parent: observability

  - id: gcloud-observability-ai-agent
    label: gcloud-observability-ai-agent
    type: mcp
    role: GCP Observability (conversations-prod)
    color: '#a78bfa'
    parent: observability

  - id: gcloud-observability-chat
    label: gcloud-observability-chat
    type: mcp
    role: GCP Observability (chat-production)
    color: '#a78bfa'
    parent: observability

  - id: cortex
    label: cortex-mcp
    type: mcp
    role: Gorgias Data
    color: '#a78bfa'
    parent: cortex-agent

  - id: notion
    label: notion-mcp
    type: mcp
    role: Knowledge Docs
    color: '#a78bfa'
    parent: knowledge-agent

  - id: linear
    label: linear-mcp
    type: mcp
    role: Issues & Epics
    color: '#a78bfa'
    parent: knowledge-agent

  # Tools (shared)
  - id: bash
    label: Bash
    type: tool
    role: Command Execution
    color: '#34d399'
    parent: null
    description: Execute shell commands, run tests, git operations, package managers
    used_by: 'All agents'

  - id: read-edit
    label: Read/Edit/Write
    type: tool
    role: File Operations
    color: '#34d399'
    parent: null
    description: Read files, edit code, create new files, modify configs
    used_by: 'main agent'

  - id: git
    label: Git
    type: tool
    role: Version Control
    color: '#34d399'
    parent: null
    description: Git operations, commit, push, rebase, branch management
    used_by: 'main agent'

  - id: gh-cli
    label: gh CLI
    type: tool
    role: GitHub Integration
    color: '#34d399'
    parent: null
    description: Query PRs, issues, checks; create/view GitHub resources
    used_by: 'main agent'

  # Skills (invoked by main)
  - id: superpowers
    label: superpowers
    type: skill
    role: Planning & Debugging
    color: '#f59e0b'
    parent: null
    description: Brainstorming, systematic debugging, test-driven development, planning
    when: 'Before feature work, bug fixes, or architectural decisions'

  - id: code-review
    label: code-review
    type: skill
    role: PR Analysis
    color: '#f59e0b'
    parent: null
    description: Review code for style, tests, security, best practices
    when: 'Before finalizing PRs or committing changes'

  - id: caveman
    label: caveman
    type: skill
    role: Terse Communication
    color: '#f59e0b'
    parent: null
    description: Compress output, drop filler, optimize token usage
    when: 'Always active for communication'

  # Infrastructure
  - id: claude-code
    label: Claude Code
    type: infra
    role: IDE Integration
    color: '#f472b6'
    parent: null
    description: Main entry point, runs agents via Claude SDK
    location: '~/.claude/settings.json'
    config: |
      • MCPs: codebase-memory-mcp, context7-mcp
      • Model: Sonnet 4.6 1M
      • Permissions: auto mode

  - id: settings
    label: settings.json
    type: infra
    role: Configuration
    color: '#f472b6'
    parent: null
    description: Configure MCPs, tools, permissions, hooks
    location: '~/.claude/settings.json or .claude/settings.json'
    config: |
      • MCP servers (codebase-memory, context7-mcp, etc)
      • Tool permissions
      • Environment variables
      • Editor integrations

  - id: zsh
    label: zsh Environment
    type: infra
    role: Shell Config
    color: '#f472b6'
    parent: null
    description: Shell environment, aliases, functions, PATH
    location: '~/.zshrc'
    config: |
      • VOLTA_HOME, GORGIAS_ROOT, etc
      • Git aliases (gpo, grbm, etc)
      • Project aliases (g:chat, g:gorgias)
      • Shell functions (dbproxy, etc)

  - id: rtk
    label: RTK
    type: infra
    role: Token Optimization
    color: '#f472b6'
    parent: null
    description: Rust Token Killer — optimizes CLI output to reduce token usage
    location: 'Via Claude Code hook'
    config: |
      • Automatically wraps bash commands
      • Filters output (60-90% reduction)
      • Enabled via PreToolUse hook

  - id: context-mode
    label: context-mode
    type: mcp
    role: Context Compression
    color: '#a78bfa'
    parent: null
    description: Token-optimized context compression (60–90% reduction). Available to all agents. Diagnostics via /context-mode:ctx-doctor and /context-mode:ctx-stats.

