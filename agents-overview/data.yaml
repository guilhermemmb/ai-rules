  - id: reviewer-data-integrity
    label: reviewer-data-integrity
    type: agent
    role: Persistence & State Integrity Audit
    color: "#f59e0b"
    parent: reviewer-coordinator
    model: GPT-5.6 Terra (medium)
    mcp_access: ""
    trigger:
      Phase A; persistence, migration, transaction, serialization, idempotency,
      event, state, synchronization, or invariant changes
  - id: reviewer-simplifier
    label: reviewer-simplifier
    type: agent
    role: Code Clarity & Simplification
    color: "#38bdf8"
    parent: reviewer-coordinator
    model: DeepSeek V4 Flash (low)
    mcp_access: ""
    trigger: Phase B; exactly once after Phase A for executable/source/config diff
  - id: reviewer-accessibility
    label: reviewer-accessibility
    type: agent
    role: WCAG 2.2 AA Audit
    color: "#f59e0b"
    parent: reviewer-coordinator
