      "
  - id: zsh-env
    label: zsh Environment
    type: infra
    role: Shell Config
    color: "#f472b6"
    parent: null
    config: "• Shell: zsh (always source ~/.zshrc)

      • VOLTA_HOME, GORGIAS_ROOT, NPM_TOKEN

      • Git aliases (gpo, grbm, etc.)

      • Project aliases (g:chat, g:gorgias)

      "
  - id: rtk
    label: RTK
    type: infra
    role: Token Optimization (Plugin)
    color: "#f472b6"
    parent: opencode
    config: "• Rust Token Killer — 60-90% token reduction

      • Active OpenCode plugin: ~/.config/opencode/plugins/rtk.ts

      • Transparently rewrites ordinary commands before execution (tool.execute.before
      hook)

      • Discovery subcommands: rtk grep, rtk read, rtk find

      • ./deploy.sh owns RTK installation and plugin initialization

      • Initialization command used by deploy.sh: rtk init -g --opencode --auto-patch

      • Homebrew formula when RTK is absent: rtk-ai/tap/rtk

      • /opt/homebrew/bin/rtk

      "
  - id: model-profiles
    label: Model Profiles
    type: infra
    role: Cost vs Performance Switching
    color: "#f472b6"
    parent: null
    config:
      "• Profiles: default, cost-efficient • Location: profiles/models/*.yml •
      Deploy: ./deploy.sh --model-profile=<name> • Schema: version 1 — each agent entry
      carries a required model and an optional variant; an omitted variant leaves the
      agent's existing variant unchanged •
      Balanced routing across speed, quality, and cost; no performance-first or
      percentage-savings claims •
      Shared both profiles: GPT-5.6 Luna (Fixer, high), GPT-5.6 Terra
      (Oracle/Sage + security/data-integrity reviewers), GLM 5.2 (Designer),
      DeepSeek V4 Flash, Gemini 3 Flash •
      default: GPT-5.6 Luna for orchestrator/detective/most reviewer lanes; DeepSeek V4
      Flash for explorer/librarian-low-tier and low-tier reviewer lanes; Gemini 3 Flash
      for observer/navigator/reviewer-accessibility •
      cost-efficient: Gemini 3 Flash orchestrator; DeepSeek V4 Flash/Pro for detective
      and reviewer lanes •
      Novita Fixer uses interleaved reasoning_content; sampling overrides
      temperature/top_p/top_k are unsupported •
      Implementation: scripts/apply-model-profile.py patches oh-my-opencode-slim.json "
  - id: bifrost
    label: Bifrost
    type: infra
    role: Model Gateway
    color: "#f472b6"
    parent: opencode
    config: "• URL: https://bifrost.ops.gorgias.io

