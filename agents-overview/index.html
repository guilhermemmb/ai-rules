<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pantheon — Agent Architecture</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background starfield */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(96, 165, 250, 0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 100%, rgba(167, 139, 250, 0.04) 0%, transparent 50%),
                        radial-gradient(ellipse at 20% 50%, rgba(244, 114, 182, 0.03) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 1.25rem 2rem;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header .subtitle {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .stat-value {
            font-weight: 700;
            color: #fbbf24;
            font-size: 1.1rem;
            font-family: ui-monospace, monospace;
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Section headers */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 3rem 0 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title:first-of-type { margin-top: 0; }

        .section-title .count {
            font-size: 0.75rem;
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            padding: 0.15rem 0.6rem;
            border-radius: 100px;
        }

        /* Agent Cards */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.25rem;
        }

        .agent-card {
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .agent-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .agent-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); border-color: rgba(255, 255, 255, 0.12); }
        .agent-card:hover::before { opacity: 1; }

        .agent-card.pantheon::before { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
        .agent-card.custom::before { background: linear-gradient(90deg, #f59e0b, #d97706); }

        .agent-header { display: flex; align-items: center; gap: 0.85rem; margin-bottom: 0.75rem; }

        .agent-avatar {
            width: 42px; height: 42px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .agent-avatar.pantheon { background: rgba(96, 165, 250, 0.12); color: #60a5fa; }
        .agent-avatar.custom { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }

        .agent-name { font-weight: 700; font-size: 1.1rem; }
        .agent-role { font-size: 0.78rem; color: #64748b; margin-top: 0.1rem; }

        .agent-model {
            display: inline-block;
            font-family: ui-monospace, monospace;
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            padding: 0.2rem 0.5rem;
            color: #94a3b8;
            margin-bottom: 1rem;
        }

        .agent-details { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, margin 0.35s ease; }
        .agent-card.expanded .agent-details { max-height: 1200px; margin-top: 1rem; }

        .detail-section { margin-bottom: 0.75rem; }
        .detail-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            margin-bottom: 0.35rem;
        }

        .detail-text { font-size: 0.8rem; color: #cbd5e1; line-height: 1.45; white-space: pre-wrap; }

        .mcp-badges, .skill-badges {
            display: flex; flex-wrap: wrap; gap: 0.35rem;
        }

        .badge {
            font-size: 0.65rem;
            font-family: ui-monospace, monospace;
            padding: 0.15rem 0.5rem;
            border-radius: 5px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-mcp {
            background: rgba(167, 139, 250, 0.12);
            color: #a78bfa;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }

        .badge-skill {
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .badge-tool {
            background: rgba(244, 114, 182, 0.12);
            color: #f472b6;
            border: 1px solid rgba(244, 114, 182, 0.2);
        }

        .badge-empty {
            background: rgba(255, 255, 255, 0.03);
            color: #475569;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Expand arrow */
        .expand-hint {
            text-align: center;
            font-size: 0.7rem;
            color: #475569;
            margin-top: 0.75rem;
            transition: opacity 0.3s;
        }

        .agent-card:hover .expand-hint { color: #64748b; }
        .agent-card.expanded .expand-hint { opacity: 0; }

        /* MCP section */
        .mcp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        .mcp-card {
            background: rgba(15, 15, 25, 0.6);
            border: 1px solid rgba(167, 139, 250, 0.12);
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.2s;
        }

        .mcp-card:hover { border-color: rgba(167, 139, 250, 0.3); background: rgba(15, 15, 25, 0.9); }

        .mcp-card .mcp-name {
            font-family: ui-monospace, monospace;
            font-size: 0.78rem;
            font-weight: 600;
            color: #a78bfa;
        }

        .mcp-card .mcp-role { font-size: 0.72rem; color: #64748b; margin: 0.25rem 0; }

        .mcp-card .mcp-parent {
            font-size: 0.68rem;
            color: #f59e0b;
            margin-top: 0.35rem;
        }

        .mcp-card .mcp-parent::before { content: '→ '; color: #64748b; }

        /* Skills section */
        .skill-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }

        .skill-group { margin-bottom: 1rem; }
        .skill-group-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            margin-bottom: 0.4rem;
        }

        .skill-chip {
            font-family: ui-monospace, monospace;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.3rem 0.7rem;
            border-radius: 8px;
            background: rgba(52, 211, 153, 0.08);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.15);
        }

        /* Infra */
        .infra-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .infra-card {
            background: rgba(244, 114, 182, 0.04);
            border: 1px solid rgba(244, 114, 182, 0.12);
            border-radius: 10px;
            padding: 1.25rem;
        }

        .infra-card .infra-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: #f472b6;
            margin-bottom: 0.5rem;
        }

        .infra-card .infra-config {
            font-size: 0.72rem;
            color: #94a3b8;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh;
            flex-direction: column;
            gap: 1rem;
        }

        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(251, 191, 36, 0.15);
            border-top: 3px solid #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error { color: #f87171; padding: 3rem; text-align: center; }

        footer {
            text-align: center;
            padding: 2rem;
            color: #334155;
            font-size: 0.75rem;
        }

        @media (max-width: 768px) {
            .agent-grid, .mcp-grid, .infra-grid { grid-template-columns: 1fr; }
            header h1 { font-size: 1.5rem; }
            main { padding: 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>The Pantheon</h1>
        <div class="subtitle">Oh My OpenCode Slim · Bifrost · OpenCode</div>
        <div class="stats-bar" id="stats"></div>
    </header>
    <main id="main">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p style="color: #64748b;">Summoning the Pantheon...</p>
        </div>
    </main>
    <footer>Click any card to expand details</footer>

    <script>
        const AVATARS = {
            orchestrator: '🏛️', oracle: '🔮', explorer: '🗺️', librarian: '📚',
            designer: '🎨', fixer: '🔧', observer: '👁️', navigator: '🧭',
            detective: '🔍', sage: '📜'
        };

        fetch('./data.yaml')
            .then(r => { if (!r.ok) throw new Error('Failed to load data.yaml'); return r.text(); })
            .then(t => jsyaml.load(t))
            .then(render)
            .catch(e => { document.getElementById('main').innerHTML = `<div class="error">${e.message}</div>`; });

        function render(data) {
            const main = document.getElementById('main');
            main.innerHTML = '';

            const nodes = data.nodes;
            const agents = nodes.filter(n => n.type === 'agent');
            const pantheon = agents.filter(a => a.parent === 'orchestrator' || a.id === 'orchestrator');
            const custom = agents.filter(a => !pantheon.includes(a));

            // Stats
            document.getElementById('stats').innerHTML = `
                <div class="stat"><span class="stat-value">${agents.length}</span> agents</div>
                <div class="stat"><span class="stat-value">${nodes.filter(n => n.type === 'mcp').length}</span> MCPs</div>
                <div class="stat"><span class="stat-value">${nodes.filter(n => n.type === 'skill').length}</span> skills</div>
                <div class="stat"><span class="stat-value">${nodes.filter(n => n.type === 'infra').length}</span> infra</div>
            `;

            // Pantheon section
            const orch = nodes.find(n => n.id === 'orchestrator');
            const builtins = pantheon.filter(a => a.id !== 'orchestrator');

            main.appendChild(section('🏛️ Pantheon — Built-in Agents', pantheon.length, () => {
                const g = el('div', { className: 'agent-grid' });
                g.appendChild(renderAgent(orch, true));
                builtins.forEach(a => g.appendChild(renderAgent(a, true)));
                return g;
            }));

            // Custom agents
            if (custom.length) {
                main.appendChild(section('⚡ Custom Agents', custom.length, () => {
                    const g = el('div', { className: 'agent-grid' });
                    custom.forEach(a => g.appendChild(renderAgent(a, false)));
                    return g;
                }));
            }

            // MCPs
            const mcps = nodes.filter(n => n.type === 'mcp');
            main.appendChild(section('🔌 MCP Servers', mcps.length, () => {
                const g = el('div', { className: 'mcp-grid' });
                mcps.forEach(m => {
                    const parentAgent = agents.find(a => a.id === m.parent);
                    const c = el('div', { className: 'mcp-card' });
                    c.innerHTML = `
                        <div class="mcp-name">${m.label}</div>
                        <div class="mcp-role">${m.role}</div>
                        <div class="mcp-parent">${parentAgent ? parentAgent.label : 'global'}</div>
                    `;
                    g.appendChild(c);
                });
                return g;
            }));

            // Skills grouped by owner
            const skills = nodes.filter(n => n.type === 'skill');
            main.appendChild(section('💡 Skills', skills.length, () => {
                const container = el('div');
                // Group by parent
                const groups = {};
                skills.forEach(sk => {
                    const parentId = sk.parent || 'other';
                    if (!groups[parentId]) groups[parentId] = [];
                    groups[parentId].push(sk);
                });
                Object.entries(groups).forEach(([parentId, group]) => {
                    const parentAgent = agents.find(a => a.id === parentId);
                    const groupEl = el('div', { className: 'skill-group' });
                    groupEl.innerHTML = `<div class="skill-group-label">${parentAgent ? parentAgent.label : parentId}</div>`;
                    const list = el('div', { className: 'skill-list' });
                    group.forEach(sk => {
                        const c = el('span', { className: 'skill-chip' });
                        c.textContent = sk.label;
                        list.appendChild(c);
                    });
                    groupEl.appendChild(list);
                    container.appendChild(groupEl);
                });
                return container;
            }));

            // Infrastructure
            const infra = nodes.filter(n => n.type === 'infra');
            main.appendChild(section('⚙️ Infrastructure', infra.length, () => {
                const g = el('div', { className: 'infra-grid' });
                infra.forEach(i => {
                    const c = el('div', { className: 'infra-card' });
                    c.innerHTML = `
                        <div class="infra-name">${i.label}</div>
                        <div class="infra-config">${(i.config || i.role || '').replace(/• /g, '').trim()}</div>
                    `;
                    g.appendChild(c);
                });
                return g;
            }));

            // Tools
            const tools = nodes.filter(n => n.type === 'tool');
            if (tools.length) {
                main.appendChild(section('🛠️ Tools', tools.length, () => {
                    const g = el('div', { className: 'infra-grid' });
                    tools.forEach(t => {
                        const c = el('div', { className: 'infra-card' });
                        c.innerHTML = `
                            <div class="infra-name" style="color:#f472b6">${t.label}</div>
                            <div class="infra-config">${(t.role || '').trim()}${t.used_by ? '\nUsed by: ' + t.used_by : ''}</div>
                        `;
                        g.appendChild(c);
                    });
                    return g;
                }));
            }
        }

        function section(title, count, renderFn) {
            const s = el('div');
            const h = el('div', { className: 'section-title' });
            h.innerHTML = `${title} <span class="count">${count}</span>`;
            s.appendChild(h);
            s.appendChild(renderFn());
            return s;
        }

        function renderAgent(agent, isPantheon) {
            const card = el('div', { className: `agent-card ${isPantheon ? 'pantheon' : 'custom'}`, onclick: () => card.classList.toggle('expanded') });
            const avatar = AVATARS[agent.id] || '🤖';
            const mcps = agent.mcp_access || '';
            const skillsList = agent.skills || '';
            const hasMCPS = mcps && mcps.trim();
            const hasSkills = skillsList && skillsList.trim();

            // Header
            let headerHTML = `<div class="agent-header">`;
            headerHTML += `<div class="agent-avatar ${isPantheon ? 'pantheon' : 'custom'}">${avatar}</div>`;
            headerHTML += `<div><div class="agent-name">${agent.label}</div><div class="agent-role">${agent.role}</div></div>`;
            headerHTML += `</div>`;
            if (agent.model) headerHTML += `<div class="agent-model">${agent.model}</div>`;

            // Details
            let detailsHTML = `<div class="agent-details">`;

            // MCPs
            if (hasMCPS) {
                detailsHTML += `<div class="detail-section"><div class="detail-label">MCPs</div><div class="mcp-badges">`;
                mcps.split(/,\s*/).forEach(m => detailsHTML += `<span class="badge badge-mcp">${m.trim()}</span>`);
                detailsHTML += `</div></div>`;
            } else {
                detailsHTML += `<div class="detail-section"><div class="detail-label">MCPs</div><span class="badge badge-empty">none</span></div>`;
            }

            // Skills
            if (hasSkills) {
                detailsHTML += `<div class="detail-section"><div class="detail-label">Skills</div><div class="skill-badges">`;
                (typeof skillsList === 'string' ? skillsList.split(/,\s*/) : [skillsList]).forEach(s => detailsHTML += `<span class="badge badge-skill">${s.toString().trim()}</span>`);
                detailsHTML += `</div></div>`;
            }

            // Constraints
            if (agent.constraints) {
                detailsHTML += `<div class="detail-section"><div class="detail-label">Constraints</div><div class="detail-text" style="color:#fca5a5">${agent.constraints}</div></div>`;
            }

            // Responsibilities
            if (agent.responsibilities) {
                detailsHTML += `<div class="detail-section"><div class="detail-label">Responsibilities</div><div class="detail-text" style="color:#a7f3d0">${agent.responsibilities}</div></div>`;
            }

            // Trigger
            if (agent.trigger) {
                detailsHTML += `<div class="detail-section"><div class="detail-label">Dispatch When</div><div class="detail-text">${agent.trigger}</div></div>`;
            }

            detailsHTML += `</div>`;

            card.innerHTML = headerHTML + detailsHTML + `<div class="expand-hint">click to expand</div>`;
            return card;
        }

        function el(tag, attrs = {}) {
            const e = document.createElement(tag);
            Object.entries(attrs).forEach(([k, v]) => { if (k === 'className') e.className = v; else if (k === 'onclick') e.addEventListener('click', v); else if (k === 'innerHTML') e.innerHTML = v; else e.setAttribute(k, v); });
            return e;
        }
    </script>
</body>
</html>
