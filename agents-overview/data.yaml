  - id: omo-slim
    label: Oh My OpenCode Slim
    type: infra
    role: Agent Orchestration
    color: "#f59e0b"
    parent: opencode
    config: "• Preset: bifrost

      • 7 built-in agents (council disabled)

      • 14 OpenCode custom agents (Navigator, Detective, Sage, reviewer-coordinator + 10 reviewer-* lanes)
      • reviewer-coordinator owns OpenCode review coordination

      • 4 SDD skills (brainstorming, writing-plans, executing-plans, reviewing-plans)
      + reviewer-coordinator skill assigned to the coordinator

