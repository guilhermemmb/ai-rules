nodes:
  # === PANTHEON — Built-in OMO Slim Agents ===

  - id: orchestrator
    label: Orchestrator
    type: agent
    role: Master Delegator
    color: '#60a5fa'
    parent: null
    model: GPT-5.6 Terra (xhigh)
    orchestrates: true
    dispatches:
      - oracle
      - explorer
      - librarian
      - designer
      - fixer
      - observer
      - navigator
      - detective
      - sage
    mcp_access: '*, !context7'
    constraints: |
      Cannot directly access: context7 (→ Librarian), sentry/datadog/gcp-logging/rootly (→ Detective),
      context-layer (→ Sage), mcp-server-browser (→ Navigator), linear/notion (→ Librarian)
      Must dispatch to appropriate agent for these tools
    responsibilities: |
      • Plan & delegate complex tasks
      • Coordinate background subagents
      • Implement simple tasks directly
      • Read security-scan rules before git commit/push/rebase
      • Never run git commands without user confirmation
      • RTK for file discovery, grep, git output

  - id: oracle
    label: Oracle
    type: agent
    role: Strategic Advisor
    color: '#60a5fa'
    parent: orchestrator
    model: DeepSeek V4 Pro (high)
    skills: simplify
    mcp_access: codebase-memory-mcp
    trigger: Architecture review, hard debugging, trade-offs, code review
    constraints: Read-heavy analysis. No sentry/datadog/context-layer MCPs.
    responsibilities: |
      • Architecture review & trade-off analysis
      • Hard debugging & root cause from code
      • Code review with simplify skill
      • Strategic technical decisions

  - id: explorer
    label: Explorer
    type: agent
    role: Codebase Reconnaissance
    color: '#60a5fa'
    parent: orchestrator
    model: DeepSeek V4 Flash (low)
    mcp_access: codebase-memory-mcp
    trigger: Broad codebase searches, pattern discovery, unfamiliar repos
    constraints: Read-only exploration. Uses RTK for efficiency.
    responsibilities: |
      • Broad codebase scouting & pattern discovery
      • Find definitions, callers, dependencies
      • Map unfamiliar repos quickly
      • Prefer codebase-memory-mcp over grep/glob

  - id: librarian
    label: Librarian
    type: agent
    role: Knowledge Retrieval
    color: '#60a5fa'
    parent: orchestrator
    model: DeepSeek V4 Flash (low)
    mcp_access: websearch, context7, gh_grep, linear, notion
    trigger: Library docs, web research, Linear issues, Notion design docs, GitHub code search
    constraints: Read-only. Linear/Notion: never create, update, or delete.
    responsibilities: |
      • Fetch current library/API documentation (context7)
      • Web search for external knowledge
      • GitHub code search across repos (gh_grep)
      • Search Linear issues/epics/cycles
      • Retrieve Notion design docs, specs, runbooks
      • Cross-reference Linear issues with Notion specs
      • Absorbed former knowledge-agent role

  - id: designer
    label: Designer
    type: agent
    role: UI/UX Excellence
    color: '#60a5fa'
    parent: orchestrator
    model: GPT-5.6 Luna (medium)
    trigger: UI/UX implementation, visual components, frontend polish
    constraints: UI/UX focused. No backend/production tooling.
    responsibilities: |
      • Implement UI components & layouts
      • Visual polish & design system adherence
      • Front-end patterns and animations

  - id: fixer
    label: Fixer
    type: agent
    role: Implementation Specialist
    color: '#60a5fa'
    parent: orchestrator
    model: Claude Sonnet 4.6 (xhigh)
    mcp_access: codebase-memory-mcp
    trigger: Scoped implementation tasks, bug fixes, code changes
    constraints: Receives concrete plan from Orchestrator. RTK for commands.
    responsibilities: |
      • Fast, scoped code implementation
      • Bug fixes with clear reproduction steps
      • Single-file or bounded multi-file changes
      • Run lint after changes
      • Conventional commits format

  - id: observer
    label: Observer
    type: agent
    role: Visual Analysis
    color: '#60a5fa'
    parent: orchestrator
    model: Gemini 2.5 Flash
    trigger: Images, screenshots, PDFs, diagrams (auto-routed from Orchestrator)
    constraints: Read-only visual analysis. Returns structured observations.
    responsibilities: |
      • Read images & screenshots
      • Parse PDFs & diagrams
      • Return observations to Orchestrator
      • Enabled because Orchestrator model is not multimodal

  # === CUSTOM AGENTS ===

  - id: navigator
    label: Navigator
    type: agent
    role: Browser Automation
    color: '#f59e0b'
    parent: orchestrator
    model: Claude Sonnet 4.6
    mcp_access: mcp-server-browser
    trigger: Browser navigation, screenshots, DOM analysis, form fills, UI automation
    constraints: |
      Browser interaction only — no backend diagnostics or code editing.
      Always headless unless told otherwise.
    responsibilities: |
      • Navigate to URLs & interact with pages
      • Take screenshots & capture page state
      • Fill forms & click elements
      • Extract page content (text, markdown)
      • Execute JavaScript in browser console

  - id: detective
    label: Detective
    type: agent
    role: Production Diagnostics
    color: '#f59e0b'
    parent: orchestrator
    model: Claude Sonnet 4.6
    mcp_access: sentry, gcp-logging, rootly, codebase-memory-mcp
    trigger: Production errors, logs, metrics, traces, incidents, root cause analysis
    constraints: |
      All tools read-only. NEVER resolve/assign/mutate issues or logs.
      Start with narrowest time range (last 1h).
      Base findings solely on tool output — never infer telemetry.
      Datadog: pup CLI (--agent --ro) via Bash — no Datadog MCP.
    responsibilities: |
      • Query Sentry for error issues & events
      • Query Datadog via pup CLI: logs, metrics, APM traces, monitors
      • Read GCP Cloud Logging
      • Access Rootly incident data
      • Correlate telemetry to source code via codebase-memory-mcp
      • Root cause analysis & incident investigation

  - id: sage
    label: Sage
    type: agent
    role: Domain Knowledge
    color: '#f59e0b'
    parent: orchestrator
    model: Claude Haiku 4.5
    mcp_access: context-layer, codebase-memory-mcp
    trigger: Gorgias metrics, table schemas, business rules, data definitions
    constraints: |
      Always call get_instruction first. Cortex read-only — never mutate.
      Map metrics to code via codebase-memory-mcp only. Cortex is source of truth.
    responsibilities: |
      • Access Gorgias metric definitions (MRR, ARR, churn, NPS, LTV)
      • Query table schemas & column mappings
      • Retrieve business rules & calculations
      • Map domain concepts to implementation code
      • Explain Gorgias business domain concepts

  # === MCPs ===

  - id: codebase-memory
    label: codebase-memory-mcp
    type: mcp
    role: Code Intelligence
    color: '#a78bfa'
    parent: null

  - id: context7-mcp
    label: context7
    type: mcp
    role: Library Docs
    color: '#a78bfa'
    parent: librarian

  - id: websearch-mcp
    label: websearch
    type: mcp
    role: Web Search (Exa)
    color: '#a78bfa'
    parent: librarian

  - id: gh-grep-mcp
    label: gh_grep
    type: mcp
    role: GitHub Code Search
    color: '#a78bfa'
    parent: librarian

  - id: linear-mcp
    label: linear
    type: mcp
    role: Issues & Epics
    color: '#a78bfa'
    parent: librarian

  - id: notion-mcp
    label: notion
    type: mcp
    role: Docs & Specs
    color: '#a78bfa'
    parent: librarian

  - id: mcp-server-browser
    label: mcp-server-browser
    type: mcp
    role: Browser Automation
    color: '#a78bfa'
    parent: navigator

  - id: sentry-mcp
    label: sentry
    type: mcp
    role: Error Monitoring
    color: '#a78bfa'
    parent: detective

  - id: pup-cli
    label: pup CLI
    type: tool
    role: Datadog CLI (--agent --ro)
    color: '#34d399'
    parent: detective

  - id: gcp-logging-mcp
    label: gcp-logging
    type: mcp
    role: GCP Logs
    color: '#a78bfa'
    parent: detective

  - id: rootly-mcp
    label: rootly
    type: mcp
    role: Incident Management
    color: '#a78bfa'
    parent: detective

  - id: context-layer-mcp
    label: context-layer
    type: mcp
    role: Gorgias Domain Data
    color: '#a78bfa'
    parent: sage

  # === Skills ===

  - id: skill-codemap
    label: codemap
    type: skill
    role: Repository Cartography
    color: '#34d399'
    parent: orchestrator

  - id: skill-deepwork
    label: deepwork
    type: skill
    role: Heavy Session Workflow
    color: '#34d399'
    parent: orchestrator

  - id: skill-verification
    label: verification-planning
    type: skill
    role: Evidence Before Code
    color: '#34d399'
    parent: orchestrator

  - id: skill-simplify
    label: simplify
    type: skill
    role: Behavior-Preserving Refactors
    color: '#34d399'
    parent: oracle

  - id: skill-worktrees
    label: worktrees
    type: skill
    role: Isolated Coding Lanes
    color: '#34d399'
    parent: orchestrator

  - id: skill-clonedeps
    label: clonedeps
    type: skill
    role: Dependency X-Ray
    color: '#34d399'
    parent: orchestrator

  - id: skill-reflect
    label: reflect
    type: skill
    role: Workflow Self-Improvement
    color: '#34d399'
    parent: orchestrator

  - id: skill-omo-slim
    label: oh-my-opencode-slim
    type: skill
    role: Plugin Self-Configuration
    color: '#34d399'
    parent: orchestrator

  - id: skill-project-context
    label: project-context
    type: skill
    role: Project Summaries
    color: '#34d399'
    parent: orchestrator

  - id: skill-dd-pup
    label: dd-pup
    type: skill
    role: Datadog CLI Reference
    color: '#34d399'
    parent: detective

  - id: skill-dd-apm
    label: dd-apm
    type: skill
    role: APM Traces & Services
    color: '#34d399'
    parent: detective

  - id: skill-dd-logs
    label: dd-logs
    type: skill
    role: Log Search & Management
    color: '#34d399'
    parent: detective

  - id: skill-dd-monitors
    label: dd-monitors
    type: skill
    role: Monitor Alerting
    color: '#34d399'
    parent: detective

  - id: skill-dd-debugger
    label: dd-debugger
    type: skill
    role: Live Debugger Probes
    color: '#34d399'
    parent: detective

  - id: skill-incident-response
    label: incident-response
    type: skill
    role: Incident Tracking & On-call
    color: '#34d399'
    parent: detective

  # === Tools ===

  - id: tool-bash
    label: Bash
    type: tool
    role: Command Execution
    color: '#f472b6'
    parent: null
    used_by: All agents

  - id: tool-read-edit
    label: Read/Edit/Write
    type: tool
    role: File Operations
    color: '#f472b6'
    parent: null
    used_by: Orchestrator, Fixer, Designer

  - id: tool-git
    label: Git
    type: tool
    role: Version Control
    color: '#f472b6'
    parent: null
    used_by: Orchestrator

  - id: tool-gh
    label: gh CLI
    type: tool
    role: GitHub Integration
    color: '#f472b6'
    parent: null
    used_by: Orchestrator

  # === Infrastructure ===

  - id: opencode
    label: OpenCode
    type: infra
    role: Entry Point · OMO Slim Plugin
    color: '#f59e0b'
    parent: null
    config: |
      • Shell: zsh
      • Providers: bf (Bifrost), bf-a (Anthropic), bf-o (OpenAI)
      • Models via Bifrost (https://bifrost.ops.gorgias.io)
      • Plugin: oh-my-opencode-slim
      • LSP integration: enabled
      • Tmux: main-vertical layout

  - id: omo-slim
    label: Oh My OpenCode Slim
    type: infra
    role: Agent Orchestration
    color: '#f59e0b'
    parent: opencode
    config: |
      • Preset: bifrost
      • 7 built-in agents (council disabled)
      • 3 custom agents (Navigator, Detective, Sage)
      • 8 bundled skills + project-context
      • Image routing: auto (Observer)

  - id: zsh-env
    label: zsh Environment
    type: infra
    role: Shell Config
    color: '#f472b6'
    parent: null
    config: |
      • Shell: zsh (always source ~/.zshrc)
      • VOLTA_HOME, GORGIAS_ROOT, NPM_TOKEN
      • Git aliases (gpo, grbm, etc.)
      • Project aliases (g:chat, g:gorgias)

  - id: rtk
    label: RTK
    type: infra
    role: Token Optimization (Plugin)
    color: '#f472b6'
    parent: opencode
    config: |
      • Rust Token Killer — 60-90% token reduction
      • Active OpenCode plugin: ~/.config/opencode/plugins/rtk.ts
      • Transparently rewrites commands before execution (tool.execute.before hook)
      • Install: rtk init -g --opencode
      • /opt/homebrew/bin/rtk

  - id: bifrost
    label: Bifrost
    type: infra
    role: Model Gateway
    color: '#f472b6'
    parent: opencode
    config: |
      • URL: https://bifrost.ops.gorgias.io
      • Providers: OpenAI-compatible, Anthropic, OpenAI
      • bf: DeepSeek V4, Gemini, GLM
      • bf-a: Claude Haiku/Sonnet/Opus
      • bf-o: GPT-4o, GPT-5.x (Luna, Sol, Terra)

