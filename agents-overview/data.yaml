# Agent model labels describe the default profile for display. YAML profiles are
# schema version 1: each agent entry carries a required model and an optional
# variant; an omitted variant leaves the agent's existing variant unchanged.
nodes:
  - id: orchestrator
    label: Orchestrator
    type: agent
    role: Master Delegator
    color: "#60a5fa"
    parent: null
    model: GPT-5.6 Luna
    orchestrates: true
    dispatches:
      - oracle
      - explorer
      - librarian
      - designer
      - fixer
      - observer
      - navigator
      - detective
      - sage
      - reviewer-coordinator
    fixer_scheduler:
      max_concurrent_children: 3
      dispatch: "OpenCode-only: up to 3 independent @fixer children with background=true"
      lifecycle: "Wait for the same batch, reconcile exact returned session IDs, then review each DONE child before dependent release"
      dependency_policy: "Overlapping, ambiguous, shared, generated, lockfile, and ordered work serializes"
      failure_policy: "NEEDS_CONTEXT, BLOCKED, timeout, failure, or malformed results hold dependents and are surfaced"
      ownership_policy: "Fixer Files are hard write allowlists; unowned changes fail closed"
    mcp_access: gitnexus, github
    review_ownership: "OpenCode: reviewer-coordinator is the sole coordinator; orchestrator delegates the complete review packet and does not preload the coordinator skill, select/directly dispatch lanes, batch, aggregate, or compute the verdict."
    constraints:
      "Hard-enforced at tool/config level: no sentry/rootly MCP access (unavailable in Detective),

      no gcp-logging MCP (→ Detective via gcloud logging),

      no cortex MCP (→ Sage or Librarian), no agent-browser CLI or chrome-devtools-mcp (→ Navigator), no linear
      (→ Librarian)

      Must dispatch to appropriate agent for these domains

      "
    responsibilities: "• Plan & delegate complex tasks

      • Coordinate background subagents

      • Implement simple tasks directly

      • Read security-scan rules before git commit/push/rebase

      • Never run git commands without user confirmation

      • RTK plugin transparently optimizes commands; follow code-exploration rule for
      discovery routing

      "
  - id: oracle
    label: Oracle
    type: agent
    role: Strategic Advisor
    color: "#a78bfa"
    parent: orchestrator
    model: GPT-5.6 Terra
    skills: simplify
    mcp_access: gitnexus
    trigger: Architecture review, hard debugging, trade-offs, code review
    constraints: Read-heavy analysis. No sentry/datadog/cortex MCPs.
    responsibilities: "• Architecture review & trade-off analysis

      • Hard debugging & root cause from code

      • Code review with simplify skill

      • Strategic technical decisions

      "
  - id: explorer
    label: Explorer
    type: agent
    role: Codebase Reconnaissance
    color: "#38bdf8"
    parent: orchestrator
    model: DeepSeek V4 Flash (low)
    mcp_access: gitnexus
    trigger: Broad codebase searches, pattern discovery, unfamiliar repos
    constraints: Read-only exploration. Follows code-exploration rule.
    responsibilities: "• Broad codebase scouting & pattern discovery

      • Find definitions, callers, dependencies

      • Map unfamiliar repos quickly

      • Follow code-exploration rule: RTK/native for exact/local discovery and GitNexus for
      structural analysis

      "
  - id: librarian
    label: Librarian
    type: agent
    role: Knowledge Retrieval
    color: "#94a3b8"
    parent: orchestrator
    model: GPT-5.6 Luna (low)
    mcp_access: websearch, context7, gh_grep, linear, cortex
    skills: cortex
    trigger:
      Library docs, web research, Linear issues, Gorgias internal docs/Notion
      via Cortex, GitHub code search
    constraints: "Read-only. Linear/Cortex: never create, update, or delete."
    responsibilities: "• Fetch current library/API documentation via Context7 (Librarian-only; follow the exact resolve-library-id → query-docs sequence)

      • Web search for external knowledge

      • GitHub code search across repos (gh_grep)

      • Search Linear issues/epics/cycles

      • Retrieve Gorgias internal docs, specs, runbooks via Cortex (replaces Notion)

      • Cross-reference Linear issues with Cortex specs

      • Absorbed former knowledge-agent role

      "
  - id: designer
    label: Designer
    type: agent
    role: UI/UX Excellence
    color: "#f59e0b"
    parent: orchestrator
    model: GLM 5.2 (medium)
    mcp_access: figma-mcp
    trigger: UI/UX implementation, visual components, frontend polish
    constraints: UI/UX focused. No backend/production tooling.
    responsibilities: "• Implement UI components & layouts

      • Visual polish & design system adherence

      • Front-end patterns and animations

      • Read design system conventions via native RTK/OpenCode tools

      • Collect and interpret Figma design specs via figma-design-to-code workflow

      • Map Figma components to codebase via figma-code-connect workflow

      "
  - id: fixer
    label: Fixer
    type: agent
    role: Implementation Specialist
    color: "#34d399"
    parent: orchestrator
    model: GPT-5.6 Luna (high)
    skills: fixer
    mcp_access: ""
    trigger: Scoped implementation tasks, bug fixes, code changes
    constraints:
      Receives concrete plan from Orchestrator with required handoff fields
      (Goal, Files, Steps, Interfaces/Constraints, Validation, Stop Conditions). Follows
      code-exploration rule. Loads fixer skill. Files is a hard write allowlist;
      no generated outputs, lockfiles, reports, or planning artifacts unless listed.
    responsibilities: "• Fast, scoped code implementation within bounded plan

      • Bug fixes with clear reproduction steps

      • Single-file or bounded multi-file changes (single-concept for Flash)

      • Scope-check before implementation — return NEEDS_CONTEXT for ambiguous or over-scoped
      tasks

      • Escalate early for stale paths, missing criteria, or cross-boundary changes
      (no speculative rounds)

      • Report with explicit status (DONE / NEEDS_CONTEXT / BLOCKED), summary, changed
      files, verification, lint outcome, and concerns

      • Run lint validation (check-only) after changes; autofix only when handoff directive
      lists permitted files

      • Follows conventional commits format but never commits or pushes — commits are
      orchestrator-owned

      "
  - id: observer
    label: Observer
    type: agent
    role: Visual Analysis
    color: "#94a3b8"
    parent: orchestrator
    model: Gemini 3 Flash Preview
    trigger: Images, screenshots, PDFs, diagrams (auto-routed from Orchestrator)
    constraints: Read-only visual analysis. Returns structured observations.
    responsibilities: "• Read images & screenshots

      • Parse PDFs & diagrams

      • Return observations to Orchestrator

      • Enabled because Orchestrator model is not multimodal

      "
  - id: navigator
    label: Navigator
    type: agent
    role: Browser Automation
    color: "#38bdf8"
    parent: orchestrator
    model: Gemini 3 Flash Preview
    mcp_access: agent-browser CLI
    trigger: Browser navigation, screenshots, DOM analysis, form fills, UI automation
    constraints:
      "Browser interaction only — no backend diagnostics or code editing.

      Always headless unless told otherwise.

      Run the agent-browser CLI through Bash. Use accessibility snapshots and @eN refs
      for interaction. Other agents must delegate browser work to Navigator.

      "
    responsibilities:
      "• Load the core agent-browser CLI skill before the first browser command

      • Navigate to URLs & interact with pages

      • Use accessibility snapshots and @eN refs for reliable interaction

      • Take screenshots & capture page state

      • Fill forms & click elements

      • Extract page content and structured data

      • Load specialized agent-browser CLI skills when needed

      "
  - id: detective
    label: Detective
    type: agent
    role: Production Diagnostics
    color: "#f87171"
    parent: orchestrator
    model: GPT-5.6 Luna (medium)
    mcp_access: gitnexus
    tools: pup CLI, gcloud CLI via Bash
    trigger: Production errors, logs, metrics, traces, incidents, root cause analysis
    constraints:
      "All tools read-only. NEVER resolve/assign/mutate issues or logs.

      Start with narrowest time range (last 1h).

      Base findings solely on tool output — never infer telemetry.

      Sentry, Rootly, and Notion MCP access is disabled in this configuration. Do not attempt to call
      them; report those sources as unavailable.

      Datadog: pup CLI (--agent --ro) via Bash — no Datadog MCP.

      "
    responsibilities: "• Query Datadog via pup CLI: logs, metrics, APM traces, monitors

      • Read GCP Cloud Logging

      • Report Sentry, Rootly, and Notion as unavailable

      • Correlate telemetry with available source-code context

      • Root cause analysis & incident investigation

      "
  - id: sage
    label: Sage
    type: agent
    role: Domain Knowledge
    color: "#60a5fa"
    parent: orchestrator
    model: GPT-5.6 Terra
    mcp_access: cortex
    skills: cortex
    trigger:
      Gorgias metrics, table schemas, business rules, data definitions, Notion/internal
      docs, design specs
    constraints:
      "Always call get_instruction first. Cortex read-only — never mutate.

      Map metrics to code with native tools. Cortex is source of truth.

      "
    responsibilities:
      "• Access Gorgias metric definitions (MRR, ARR, churn, NPS, LTV)

      • Query table schemas & column mappings

      • Retrieve business rules & calculations

      • Retrieve Notion/internal documentation, design specs, runbooks via Cortex

      • Map domain concepts to implementation code

      • Explain Gorgias business domain concepts

      "
  - id: reviewer-coordinator
    label: reviewer-coordinator
    type: agent
    role: OpenCode Review Coordinator
    color: "#f59e0b"
    parent: orchestrator
    model: DeepSeek V4 Flash (medium)
    mcp_access: gitnexus
    skills: reviewer-coordinator
    trigger: Receives complete OpenCode review packets from the orchestrator
    dispatches:
      - reviewer-code
      - reviewer-test
      - reviewer-errors
      - reviewer-types
      - reviewer-security
      - reviewer-performance
      - reviewer-data-integrity
      - reviewer-accessibility
      - reviewer-comments
      - reviewer-simplifier
    constraints:
      "Sole OpenCode review coordinator. GitNexus access is read-only evidence. The orchestrator delegates the complete packet;
      this agent owns policy, lane selection, batching, aggregation, and verdict.

      Runs the first nine lanes in Phase A batches capped by REVIEWER_MAX_PARALLEL
      (default and maximum 3; invalid values fall back to 3; values above 3 are clamped),
      then reviewer-simplifier exactly once sequentially in Phase B when applicable.

      Stale/outdated/empty/partial/truncated/unknown/ambiguous/degraded/error/timeout/
      unmapped GitNexus evidence is unusable: fallback=native, refresh=not permitted,
      no graph claims, and disclose graph coverage unavailable.

      Returns one inline Markdown report with telemetry, triggered/skipped lanes,
      batches/session IDs, timing, GitNexus status/fallback, Review Health, verdict,
      prioritized findings, strengths, and recommended action.

      "
    responsibilities: "• Owns comprehensive PR and code review coordination

      • Selects up to 10 applicable reviewer-* specialists using target-aware policy

      • Dispatches independent lanes in concurrency-limited background batches

      • Aggregates findings into one structured report

      • Tolerates failed/invalid outputs and deduplicates valid findings

      • Read-only — never modifies files or posts GitHub comments

      "
  - id: reviewer-code
    label: reviewer-code
    type: agent
    role: CLAUDE.md Compliance & Bugs
    color: "#f87171"
    parent: reviewer-coordinator
    model: GPT-5.6 Luna (medium)
    mcp_access: ""
    trigger: Phase A; always selected unless excluded by aspects policy
  - id: reviewer-comments
