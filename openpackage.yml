name: ai-rules
version: 2.1.0
description: AI coding rules, agents, skills, and commands for OpenCode + Oh My OpenCode Slim
author: guilhermebomfim
license: MIT

platforms:
  opencode: true

rules: rules/*.md

agents: agents/*.md

skills: skills/*

commands: commands/*.md

mcp: opencode.jsonc

# Core OpenCode configuration files
config:
  opencode: opencode.json           # Provider & model definitions (bf, bf-a, bf-o)
  omo_slim: oh-my-opencode-slim.json  # Agent model assignments & routing
  omo_append: oh-my-opencode-slim/    # Agent-specific prompt append files
